---
name: Docker Build CI

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: 'ubuntu-latest'

    steps:
      - name: checkout repo
        uses: actions/checkout@v3

      - name: Build modbus-sim
        uses: docker build -t modbus-sim ./modbus-sim

      - name: Build gateway-core
        uses: docker build -t gateway-core ./gateway-core

      - name: Build edge-client
        uses: docker build -t edge-cient ./edge-client
